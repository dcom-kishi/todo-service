services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - .env
      - .env.local
    environment:
      - NEXT_PUBLIC_BACKEND_URL=http://localhost:8000
    depends_on:
      - backend

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/.venv
    env_file:
      - .env
      - .env.local
    environment:
      - SUPABASE_URL=http://host.docker.internal:54321
    depends_on:
      - supabase-ready

  # Dummy service to wait for Supabase
  supabase-ready:
    image: alpine
    command: /bin/sh -c "echo Supabase is assumed to be running on host"
