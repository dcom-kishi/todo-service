name: 💡 Feature Request
description: Request a new feature.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for your feature suggestion. Please provide the following information.

  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: Please provide a detailed description of the feature.
      placeholder: Please be specific.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: Please describe the expected behavior.
    validations:
      required: true
